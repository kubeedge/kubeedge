name: Chart Lint

on:
  push:
    branches:
      - master
    paths:
      - 'manifests/charts/**'
      - '.github/workflows/chart-testing.yml'
      - 'ct.yaml'
  pull_request:
    paths:
      - 'manifests/charts/**'
      - '.github/workflows/chart-testing.yml'
      - 'ct.yaml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0
        with:
          version: v3.13.0
          yamllint_version: '1.33.0'
          yamale_version: '4.0.4'

      - name: Lint charts
        run: ct lint --config ct.yaml --all
