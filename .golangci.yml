version: "2"
run:
  concurrency: 4
  timeout: 10m
  issues-exit-code: 1
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    - errcheck
    - goconst
    - govet
    - misspell
    - revive
    - staticcheck
    - whitespace
  settings:
    staticcheck:
      # gosimple was merged into staticcheck in v2; keep its simplification checks.
      checks:
        - S*
    misspell:
      ignore-rules:
        - mosquitto
        - creater
        - resouce
    revive:
      rules:
        - name: dot-imports
          arguments:
            - allowedPackages:
                - github.com/onsi/ginkgo/v2
                - github.com/onsi/gomega
          severity: warning
          disabled: false
        - name: unused-parameter
          arguments:
            - allowRegex: ^_
          severity: warning
          disabled: true
        - name: unused-receiver
          arguments:
            - allowRegex: ^_
          severity: warning
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - vendor
      - fake
      - externalversions
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
  uniq-by-line: true
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kubeedge
  exclusions:
    generated: lax
    paths:
      - vendor
      - fake
      - externalversions
      - third_party$
      - builtin$
      - examples$
